[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zcode-task-notifier"
version = "0.2.0"
description = "ZCode 与可选 Codex 的实际任务停顿外置通知器"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."console_scripts"]
"zcode-task-notifier" = "zcode_task_notifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
